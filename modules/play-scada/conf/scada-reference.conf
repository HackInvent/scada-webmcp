scada {
  simulator { enabled = false, port = 12686 }
  opcua {
    endpoint = ""
    security-policy = "Basic256Sha256"
    security-mode = "SignAndEncrypt"
    application-uri = "urn:hackinvent:scada:client"
    keystore = "data/opcua/client.p12"
    keystore-password = ""
    keystore-password = ${?SCADA_KEYSTORE_PASSWORD}
    key-alias = "client"
    trust-directory = "data/opcua/pki"
    username = ""
    username = ${?SCADA_OPCUA_USERNAME}
    password = ""
    password = ${?SCADA_OPCUA_PASSWORD}
    publish-interval-ms = 500
  }
  security {
    reader-token = ""
    reader-token = ${?SCADA_READER_TOKEN}
    operator-token = ""
    operator-token = ${?SCADA_OPERATOR_TOKEN}
    local-demo-access = true
    session-duration = 8 hours
  }
  stale-after = 10 seconds
  refresh-interval = 3 seconds
  openai {
    api-key = ""
    api-key = ${?OPENAI_API_KEY}
    model = ""
    model = ${?OPENAI_MODEL}
    endpoint = "https://api.openai.com/v1/responses"
    timeout = 45 seconds
    max-tool-rounds = 6
    max-output-tokens = 2048
  }
  tags = []
  commands = []
}
