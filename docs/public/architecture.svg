<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 420" role="img" aria-labelledby="title desc">
<title id="title">One Java core, three integration paths</title>
<desc id="desc">An OPC UA server connects to a shared Play Java core through Eclipse Milo. The core serves an HTML HMI with WebMCP, remote MCP clients, and an optional read-only OpenAI assistant.</desc>
