<g fill="#fff" stroke="#c9ddd7"><rect x="454" y="53" width="142" height="82" rx="12"/><rect x="454" y="169" width="142" height="82" rx="12"/><rect x="454" y="285" width="142" height="82" rx="12"/></g>
