<text x="96" y="192" text-anchor="middle" font-size="12" fill="#617973">PROCESS DATA</text><text x="96" y="219" text-anchor="middle" font-size="19" font-weight="650" fill="#173d36">OPC UA</text><text x="96" y="242" text-anchor="middle" font-size="12" fill="#617973">Server / simulator</text>
