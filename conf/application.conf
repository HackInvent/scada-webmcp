include "scada-reference.conf"

play.http.secret.key = ${?APPLICATION_SECRET}
play.filters.hosts.allowed = ["localhost", "127.0.0.1", "[::1]"]
play.http.parser.maxMemoryBuffer = 128k
play.http.session.httpOnly = true
play.http.session.sameSite = "lax"
play.http.session.secure = false
play.http.session.secure = ${?SESSION_SECURE}

scada.simulator.enabled = true
scada.simulator.enabled = ${?SCADA_SIMULATOR_ENABLED}
scada.simulator.port = 12686
scada.simulator.port = ${?SCADA_SIMULATOR_PORT}
scada.opcua.endpoint = "opc.tcp://127.0.0.1:12686/scada"
scada.opcua.endpoint = ${?SCADA_OPCUA_ENDPOINT}

scada.tags = [
  { id = "tank.temperature", nodeId = "nsu=urn:hackinvent:scada:demo;s=tank.temperature", label = "Température de la cuve", unit = "°C", dataType = "Double", writable = false },
  { id = "pump.running", nodeId = "nsu=urn:hackinvent:scada:demo;s=pump.running", label = "Pompe de circulation", unit = "", dataType = "Boolean", writable = true },
  { id = "tank.setpoint", nodeId = "nsu=urn:hackinvent:scada:demo;s=tank.setpoint", label = "Consigne de température", unit = "°C", dataType = "Double", writable = true }
]
scada.commands = [
  { id = "pump.start", label = "Démarrer la pompe", description = "Demande le démarrage de la pompe de circulation", tagId = "pump.running", requiresValue = false, fixedValue = true },
  { id = "pump.stop", label = "Arrêter la pompe", description = "Demande l'arrêt de la pompe de circulation", tagId = "pump.running", requiresValue = false, fixedValue = false },
  { id = "tank.setpoint", label = "Régler la consigne", description = "Écrit la consigne de température entre 10 et 80 °C", tagId = "tank.setpoint", requiresValue = true, min = 10, max = 80 }
]
